---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: gpujobs.scheduler.lawson.com
spec:
  group: scheduler.lawson.com
  names:
    kind: GPUJob
    listKind: GPUJobList
    plural: gpujobs
    singular: gpujob
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              gangSize:
                format: int32
                minimum: 1
                type: integer
              gpuCount:
                format: int32
                minimum: 1
                type: integer
              priority:
                format: int32
                type: integer
              schedulerName:
                description: |-
                  SchedulerName specifies the name of the scheduler that should handle this job.
                  If set to "default-scheduler", the native K8s scheduler will take over.
                  If set to "my-gpu-scheduler", your custom scheduler will manage it.
                type: string
              vramPerGPU:
                type: string
            required:
            - gangSize
            - gpuCount
            - priority
            - vramPerGPU
            type: object
            x-kubernetes-validations:
            - message: spec.gangSize cannot be greater than spec.gpuCount
              rule: self.gangSize <= self.gpuCount
          status:
            properties:
              phase:
                type: string
              readyReplicas:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
