# permissions for end users to view gpujobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: gpu-crd
    app.kubernetes.io/managed-by: kustomize
  name: gpujob-viewer-role
rules:
- apiGroups:
  - scheduler.lawson.com
  resources:
  - gpujobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scheduler.lawson.com
  resources:
  - gpujobs/status
  verbs:
  - get
