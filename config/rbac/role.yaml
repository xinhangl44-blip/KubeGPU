---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scheduler.lawson.com
  resources:
  - gpujobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scheduler.lawson.com
  resources:
  - gpujobs/finalizers
  verbs:
  - update
- apiGroups:
  - scheduler.lawson.com
  resources:
  - gpujobs/status
  verbs:
  - get
  - patch
  - update
